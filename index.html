<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1F4D3D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ledger" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <title>Ledger</title>
  <style>
    /* "Modernist" redesign layout: sharp corners, flat bordered surfaces instead of
       shadowed rounded cards, Archivo throughout instead of Fraunces/IBM Plex Mono.
       Scoped to [data-layout="modern"] (set by applyTheme in lib/themes.js) so it
       never touches the classic layout's components or styles. */
    html[data-layout="modern"] { font-family: 'Archivo', system-ui, sans-serif; }
    html[data-layout="modern"] *,
    html[data-layout="modern"] *::before,
    html[data-layout="modern"] *::after {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    html[data-layout="modern"] [style*="box-shadow"] {
      border: 1px solid var(--line);
    }
    html[data-layout="modern"] [style*="Fraunces"],
    html[data-layout="modern"] [style*="IBM Plex Mono"],
    html[data-layout="modern"] [style*="Inter"] {
      font-family: 'Archivo', system-ui, sans-serif !important;
    }

    /* Modern layout shell: sidebar in-flow on desktop, a collapsible slide-in
       drawer (behind a hamburger button) below the 768px breakpoint. */
    html[data-layout="modern"] .modern-shell {
      min-height: 100vh; background: var(--bg); display: grid; grid-template-columns: 210px 1fr;
    }
    html[data-layout="modern"] .modern-hamburger { display: none; }
    html[data-layout="modern"] .modern-sidebar-backdrop { display: none; }
    html[data-layout="modern"] .modern-main { padding-bottom: 100px !important; }
    html[data-layout="modern"] .modern-bottom-nav {
      position: fixed; bottom: 0; left: 210px; right: 0; z-index: 20; display: flex; justify-content: space-around;
      padding: 8px 0; background: var(--sidebar-bg); border-top: 1px solid var(--line);
    }
    @media (max-width: 767px) {
      html[data-layout="modern"] .modern-shell { display: block; }
      html[data-layout="modern"] .modern-sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: 240px; max-width: 82vw;
        z-index: 40; transform: translateX(-100%); transition: transform 0.2s ease; overflow-y: auto;
      }
      html[data-layout="modern"] .modern-sidebar.is-open { transform: translateX(0); }
      html[data-layout="modern"] .modern-hamburger { display: inline-flex; }
      html[data-layout="modern"] .modern-bottom-nav { left: 0; }
      html[data-layout="modern"] .modern-sidebar-backdrop.is-open {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30;
      }
    }
  </style>
</head>
<body style="margin:0;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
